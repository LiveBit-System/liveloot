<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="/i18n.js"></script>
<title>LiveLoot - עוקבים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Fredoka:wght@500;600;700&family=Noto+Sans+Hebrew:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/overlay/overlay.css">
<style>html, body { margin: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; }</style>
</head>
<body>
<script src="/socket.io/socket.io.js"></script>
<script src="/overlay/sound.js"></script>
<script src="/overlay/alerts.js"></script>
<script src="/overlay/followers.js"></script>
<script>
  // מומלץ ב-LIVE Studio: רזולוציה 500 על 520
  const view = FollowersView(document.body, { muted: new URLSearchParams(location.search).has('muted') });
  const socket = io(location.pathname.startsWith('/w/') ? { query: { key: location.pathname.split('/')[2] } } : undefined);
socket.on('langChanged', () => location.reload());
  socket.on('config', c => view.setSettings(c.followers || {}));
  socket.on('followers', d => view.setData(d, d.initial));
</script>
</body>
</html>
