<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="/i18n.js"></script>
<title>LiveLoot - Top Streak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Fredoka:wght@500;600;700&family=Noto+Sans+Hebrew:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/overlay/overlay.css">
<style>html, body { margin: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; }</style>
</head>
<body>
<script src="/socket.io/socket.io.js"></script>
<script src="/overlay/sound.js"></script>
<script src="/overlay/alerts.js"></script>
<script src="/overlay/topgift.js"></script>
<script>
  // Top Streak משתמש באותה תצוגה של Top Gift, עם מספר ברצף במקום מטבעות
  function streakSettings(t) { return { ...t, coinsColor: t.numColor, coinsLabel: "ברצף", showCoins: true, emptyCoins: 50, titleSize: 50, nameSize: 50 }; }
</script>
<script>
  // מומלץ ב-OBS: Browser Source ברוחב 600 וגובה 520
  const view = TopGiftView(document.body, { streak: true, muted: new URLSearchParams(location.search).has("muted") });
  const socket = io(location.pathname.startsWith('/w/') ? { query: { key: location.pathname.split('/')[2] } } : undefined);
socket.on('langChanged', () => location.reload());
  socket.on("config", c => view.setSettings(streakSettings(c.topStreak)));
  socket.on("topStreak", d => view.setTop(d));
</script>
</body>
</html>
