<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="/i18n.js"></script>
<title>LiveLoot - טיימר סאבתון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Fredoka:wght@500;600;700&family=Noto+Sans+Hebrew:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/overlay/overlay.css">
<style>html, body { margin: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; }</style>
</head>
<body>
<script src="/socket.io/socket.io.js"></script>
<script src="/overlay/sound.js"></script>
<script src="/overlay/alerts.js"></script>
<script src="/overlay/timer.js"></script>
<script>
  // מומלץ ב-LIVE Studio: רוחב 700 וגובה 360
  const view = TimerView(document.body, { muted: new URLSearchParams(location.search).has('muted') });
  const socket = io();
socket.on('langChanged', () => location.reload());
  socket.on('config', c => view.setSettings(c.timer || {}));
  socket.on('timer', d => view.setData(d));
  // טיימר סאבתון: רק ב-PRO
  socket.on('pro', p => { document.body.style.visibility = p && p.active ? '' : 'hidden'; });
</script>
</body>
</html>
